name: Publish Python release

on:
  schedule:
    # GitHub Actions 使用 UTC；每天北京时间 00:00 检查一次。
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish when commits changed
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Check for commits after the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_sha="$(git rev-parse HEAD)"
          short_sha="${current_sha:0:12}"
          latest_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          previous_sha=""

          if [[ -n "$latest_tag" ]]; then
            previous_sha="$(git rev-parse --verify "refs/tags/${latest_tag}^{commit}" 2>/dev/null || true)"
            if [[ -z "$previous_sha" ]]; then
              git fetch --force origin "refs/tags/${latest_tag}:refs/tags/${latest_tag}"
              previous_sha="$(git rev-parse --verify "refs/tags/${latest_tag}^{commit}")"
            fi
          fi

          if [[ -n "$previous_sha" ]]; then
            commit_count="$(git rev-list --count "${previous_sha}..${current_sha}")"
          else
            commit_count="$(git rev-list --count "$current_sha")"
          fi

          if [[ -n "$previous_sha" && "$previous_sha" == "$current_sha" ]] || [[ "$commit_count" == "0" ]]; then
            should_publish="false"
          else
            should_publish="true"
          fi

          release_tag="v$(date -u +%Y.%m.%d)-${short_sha}"
          release_version="${release_tag#v}"

          {
            echo "should_publish=$should_publish"
            echo "current_sha=$current_sha"
            echo "latest_tag=$latest_tag"
            echo "commit_count=$commit_count"
            echo "release_tag=$release_tag"
            echo "release_version=$release_version"
          } >> "$GITHUB_OUTPUT"

          if [[ "$should_publish" == "true" ]]; then
            echo "检测到 ${commit_count} 个新提交，将发布 ${release_tag}。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "默认分支相较最新 Release（${latest_tag}）没有新提交，本次不发布。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.release.outputs.should_publish == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run tests
        if: steps.release.outputs.should_publish == 'true'
        run: python -m unittest discover -s tests

      - name: Build release archives
        if: steps.release.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import shutil
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          output = Path("dist")
          package = output / f"AnyLine-{version}"
          output.mkdir(exist_ok=True)
          package.mkdir()

          for filename in ("app.py", "audit.py", "requirements.txt", "README.md", "LICENSE"):
              shutil.copy2(filename, package / filename)
          for directory in ("static", "scripts"):
              shutil.copytree(
                  directory,
                  package / directory,
                  ignore=shutil.ignore_patterns("__pycache__", "*.pyc", "*.pyo"),
              )
          (package / "VERSION").write_text(version + "\n", encoding="utf-8")

          archives = [
              Path(shutil.make_archive(str(package), "zip", output, package.name)),
              Path(shutil.make_archive(str(package), "gztar", output, package.name)),
          ]
          checksum_lines = []
          for archive in archives:
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              checksum_lines.append(f"{digest}  {archive.name}")
          (output / "SHA256SUMS.txt").write_text(
              "\n".join(checksum_lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Publish GitHub Release
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.release.outputs.current_sha }}
          COMMIT_COUNT: ${{ steps.release.outputs.commit_count }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            dist/AnyLine-*.zip \
            dist/AnyLine-*.tar.gz \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "AnyLine ${RELEASE_TAG#v}" \
            --generate-notes

          echo "已发布 ${RELEASE_TAG}，包含 ${COMMIT_COUNT} 个新提交。" >> "$GITHUB_STEP_SUMMARY"
